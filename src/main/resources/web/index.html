<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthCore Frontend</title>
    <style>
        :root {
            color-scheme: dark;
            --card-bg: rgba(32, 40, 52, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #4fd1c5;
            --warning: #f6ad55;
            --danger: #f56565;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(79, 209, 197, 0.25), transparent 25%),
                        radial-gradient(circle at 80% 0%, rgba(246, 173, 85, 0.15), transparent 20%),
                        #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 0.01em;
        }

        main {
            padding: 20px;
            display: grid;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .stack {
            display: grid;
            gap: 12px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
        }

        button {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: #0b1120;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        button:hover { filter: brightness(1.05); }
        button:active { transform: scale(0.98); }

        .muted { color: #94a3b8; font-size: 0.95rem; margin: 0; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 6px 10px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
        }

        .pill.warning { color: var(--warning); }
        .pill.danger { color: var(--danger); }

        #map-container {
            height: 70vh;
            min-height: 420px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.4);
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            background: #0b1120;
        }

        @media (max-width: 720px) {
            header { flex-direction: column; align-items: flex-start; }
            #map-container { height: 55vh; }
        }
    </style>
</head>
<body>
<header>
    <h1>EarthCore · Dynmap Hub</h1>
    <p class="muted">Autenticação simplificada via nome de usuário (v1 experimental)</p>
</header>

<main class="stack">
    <section class="card stack" aria-label="Autenticação">
        <div class="form-row">
            <label for="username">Nome de usuário</label>
            <input id="username" type="text" placeholder="ex: Steve" autocomplete="off" />
            <button id="login-btn">Entrar</button>
        </div>
        <p class="muted">Nenhuma senha é solicitada nesta versão inicial. O backend valida o nome informado e retorna seus dados salvos.</p>
        <div id="status" class="pill warning" hidden>Carregando...</div>
    </section>

    <section class="card stack" aria-label="Perfil">
        <h2 style="margin: 0;">Seu perfil</h2>
        <div id="profile">
            <p class="muted">Informe seu nome para visualizar clã, reino e saldo.</p>
        </div>
    </section>

    <section class="card" aria-label="Dynmap">
        <div id="map-container">
            <iframe id="dynmap-frame" src="{{DYNMAP_URL}}" title="Dynmap"></iframe>
        </div>
    </section>
</main>

<script>
    window.DynmapConfig = { baseUrl: "{{DYNMAP_URL}}" };
</script>
<script src="/assets/app.js" defer></script>
</body>
</html>
