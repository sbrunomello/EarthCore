# Configuração padrão do EarthCore
# - Spawn global fica salvo aqui.
# - Ajuste conforme o mundo e coordenadas do seu servidor.

spawn:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Configuração do frontend incorporado que hospeda a experiência web unificada
# junto ao plugin. O frontend expõe um iframe apontando para o Dynmap já
# existente, mais uma camada de autenticação simples via nome de usuário que
# consulta as informações gravadas pelo plugin.
frontend:
  enabled: true
  host: "0.0.0.0"
  port: 8210
  dynmapUrl: "http://localhost:8123/"
  jwtSecret: "troque-este-segredo"
  jwtIssuer: "earthcore"
  allowedOrigins:
    - "http://localhost"
    - "http://127.0.0.1"
  rateLimitPerMinute: 30

# Portais de viagem por aldeão: cada entrada representa um hub de continente.
# O aldeão aparece no ponto "totem" e abre uma GUI com os demais portais configurados.
# portals:
#   africa:
#     target:  # onde o jogador pousa ao clicar neste destino na GUI
#       world: world
#       x: 1500.5
#       y: 70.0
#       z: -200.5
#       yaw: 180.0
#       pitch: 0.0
#     totem:   # posição do aldeão de viagem
#       world: world
#       x: 10
#       y: 65
#       z: 5
#   europa:
#     target:
#       world: world
#       x: -2200.5
#       y: 68.0
#       z: 340.5
#       yaw: 0.0
#       pitch: 0.0
#     totem:
#       world: world
#       x: 20
#       y: 65
#       z: 5

claims:
  protection_enabled: true
  deny_message_cooldown_ticks: 20

claim:
  no_permission: "&cVocê não pode criar claims."
  already_claimed: "&cEste chunk já está claimed."
  preview_started: "&aPreview criado! Confirme ou cancele."
  claim_confirmed: "&aClaim criado com sucesso!"
  claim_cancelled: "&cClaim cancelado."
  preview_restored: "&7Preview removido."
  insufficient_bank: "&cBanco do grupo não possui saldo suficiente."

scoreboard:
  enabled: true
  title: "&b&l2&f&l0&a&l2&f&lX &7| &aEARTH"
  footer: "&7play.202Xearth.gg"
  colors:
    separator: "&8&l────────────────"
    label: "&7"
    value: "&f"
