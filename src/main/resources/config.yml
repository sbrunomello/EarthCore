# Configuração padrão do EarthCore
# - Spawn global fica salvo aqui.
# - Ajuste conforme o mundo e coordenadas do seu servidor.

spawn:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Configuração do frontend incorporado que hospeda a experiência web unificada
# junto ao plugin. O frontend expõe um iframe apontando para o Dynmap já
# existente, mais uma camada de autenticação simples via nome de usuário que
# consulta as informações gravadas pelo plugin.
frontend:
  enabled: true
  host: "0.0.0.0"
  port: 8210
  dynmapUrl: "http://localhost:8123/"

