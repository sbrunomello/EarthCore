skills:
  hud:
    enabled: true
    show_on_xp_gain: true
    show_only_for_player: true
    min_xp_to_show: 0.1
    display_duration_ticks: 60
    title_format: "&e[%skill_display%] &7Nível &a%level% &7- &b%current_xp%&7/&b%required_xp% XP &7(&a%progress_percent%%&7)"
    max_level_title_format: "&e[%skill_display%] &aNÍVEL MÁXIMO"
    bossbar:
      color: "GREEN"
      overlay: "SEGMENTED_10"
    actionbar:
      enabled: false # Mensagens de XP em action bar desativadas para não sobrescrever avisos do Jobs; ative apenas se precisar.
      format: "&a+%gained_xp% XP &7em &e%skill_display% &7(Nv %old_level% &7→ &a%new_level%)"
  MINING:
    display_name: "Minerador"
    enabled: true
    base_xp_curve: 100.0
    curve_multiplier: 1.25
    max_level: 100
    icon: "IRON_PICKAXE"
    xp_sources:
      MINING: 1.0
    xp_events:
      STONE: 0.5
      COBBLESTONE: 0.5
      COAL_ORE: 2.0
      IRON_ORE: 4.0
      GOLD_ORE: 6.0
      DIAMOND_ORE: 10.0
  FARMING:
    display_name: "Fazendeiro"
    enabled: true
    base_xp_curve: 80.0
    curve_multiplier: 1.2
    max_level: 100
    icon: "IRON_HOE"
    xp_sources:
      FARMING: 1.0
    xp_events:
      WHEAT: 1.0
      POTATOES: 1.0
      CARROTS: 1.0
  WOODCUTTING:
    display_name: "Lenhador"
    enabled: true
    base_xp_curve: 90.0
    curve_multiplier: 1.22
    max_level: 100
    icon: "IRON_AXE"
    xp_sources:
      WOODCUTTING: 1.0
    xp_events:
      OAK_LOG: 1.2
      BIRCH_LOG: 1.2
      SPRUCE_LOG: 1.2
  HUNTER:
